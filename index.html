<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PixelLab - Phase 2 Demo</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1f1b24; color: #fff; text-align: center; margin: 0; padding: 20px; }
  canvas { width: min(90vw, 640px); height: auto; aspect-ratio: 1; image-rendering: pixelated; background: #fff; border: 3px solid #e4572e; cursor: pointer; }
  p { color: #cfcbd6; max-width: 640px; margin: 10px auto; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 0; background: #17bebb; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <h1>PixelLab - core algorithms</h1>
  <canvas id="c" width="64" height="64"></canvas>
  <p>Every pixel here is set by my own code: Bresenham lines (star), midpoint circles, scanline polygon fill (triangle) and flood fill. <b>Click inside any closed shape</b> to flood-fill it.</p>
  <button id="reset">Reset</button>
  <script src="js/framebuffer.js"></script>
  <script src="js/algorithms.js"></script>
  <script>
    const { Framebuffer, hexToRgba, Algo } = PL;
    const fb = new Framebuffer(64, 64);
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const img = ctx.createImageData(64, 64);

    function drawScene() {
      fb.clear([255, 255, 255, 255]);
      const put = (rgba) => (x, y) => fb.set(x, y, rgba);
      const span = (rgba) => (x0, x1, y) => { for (let x = x0; x <= x1; x++) fb.set(x, y, rgba); };
      const black = [0, 0, 0, 255];
      // Bresenham: a star of lines from a centre
      for (let a = 0; a < 360; a += 30) {
        const r = a * Math.PI / 180;
        Algo.bresenham(16, 16, Math.round(16 + 13 * Math.cos(r)), Math.round(16 + 13 * Math.sin(r)), put(black));
      }
      // Midpoint circle outline + filled disc
      Algo.midpointCircle(48, 16, 12, put([30, 111, 217, 255]));
      Algo.fillCircle(48, 16, 5, span([242, 169, 0, 255]));
      // Scanline fill: triangle
      Algo.scanlineFill([[6, 60], [26, 36], [46, 60]], span([46, 158, 79, 255]));
      // Closed box (outline only) to flood-fill
      const box = put([217, 56, 30, 255]);
      Algo.bresenham(50, 36, 62, 36, box); Algo.bresenham(62, 36, 62, 60, box);
      Algo.bresenham(62, 60, 50, 60, box); Algo.bresenham(50, 60, 50, 36, box);
      present();
    }
    function present() { img.data.set(fb.data); ctx.putImageData(img, 0, 0); }

    canvas.addEventListener("click", (e) => {
      const r = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - r.left) / r.width * 64);
      const y = Math.floor((e.clientY - r.top) / r.height * 64);
      const col = [Math.random() * 200 | 0, Math.random() * 200 | 0, Math.random() * 200 | 0, 255];
      Algo.floodFill(64, 64, (px, py) => fb.key(px, py), x, y, (px, py) => fb.set(px, py, col));
      present();
    });
    document.getElementById("reset").onclick = drawScene;
    drawScene();
  </script>
</body>
</html>
